name: Public portal and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npx --yes pnpm@11.25.0 install --frozen-lockfile --ignore-scripts
      - run: node scripts/vendor-manifest.mjs --check
      - run: node --experimental-strip-types --test tests/*.test.mjs sovereign/tests/*.test.mjs
      - run: node_modules/.bin/tsc --noEmit
      - run: node_modules/.bin/eslint sovereign --max-warnings 0
      - run: npm run build
      - run: node scripts/build-pages.mjs
      - run: node scripts/check-pages.mjs
      - run: python3 -m unittest discover -s hacksandbox/tests -p 'test_*.py'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
          retention-days: 1
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
