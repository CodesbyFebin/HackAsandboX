# Install and verify Kata on selected Linux nodes before using generated Jobs.
# A RuntimeClass selects an existing CRI handler; it does not install Kata/Firecracker.
apiVersion: v1
kind: Namespace
metadata:
  name: hackasandbox-workers
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: hackasandbox-workers
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mission-budget
  namespace: hackasandbox-workers
spec:
  hard:
    pods: '4'
    requests.cpu: '2'
    requests.memory: 2Gi
    limits.cpu: '4'
    limits.memory: 4Gi
    requests.ephemeral-storage: 4Gi
    limits.ephemeral-storage: 8Gi
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata
handler: kata
scheduling:
  nodeSelector:
    hackasandbox.codesbyfebin/sandbox-runtime: kata
